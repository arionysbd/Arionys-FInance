name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read deployment config
        id: cfg
        shell: bash
        run: |
          CONFIG_FILE=".github/workflows/deploy.config"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Error: $CONFIG_FILE not found."
            exit 1
          fi

          set -a
          source "$CONFIG_FILE"
          set +a

          MODE="${MODE,,}"
          if [ "$MODE" != "dev" ] && [ "$MODE" != "build" ] && [ "$MODE" != "host" ]; then
            echo "Error: MODE must be 'dev', 'build' or 'host' in deploy.config"
            exit 1
          fi

          if [ "$MODE" = "dev" ]; then
            echo "MODE=dev: skipping deployment."
            echo "mode=dev" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          : "${APP_NAME:?APP_NAME is required in deploy.config}"
          : "${APP_PATH:?APP_PATH is required in deploy.config}"
          : "${PORT:?PORT is required in deploy.config}"

          if [ "$MODE" = "host" ]; then
            : "${DOMAIN:?DOMAIN is required in deploy.config when MODE=host}"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "domain=${DOMAIN:-}" >> "$GITHUB_OUTPUT"
          echo "aliases=${ALIASES:-}" >> "$GITHUB_OUTPUT"
          echo "email=${EMAIL:-community.slsn.env@gmail.com}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        if: steps.cfg.outputs.mode != 'dev'
        uses: appleboy/ssh-action@v1.2.0
        env:
          MODE: ${{ steps.cfg.outputs.mode }}
          APP_NAME: ${{ steps.cfg.outputs.app_name }}
          APP_PATH: ${{ steps.cfg.outputs.app_path }}
          PORT: ${{ steps.cfg.outputs.port }}
          DOMAIN: ${{ steps.cfg.outputs.domain }}
          ALIASES: ${{ steps.cfg.outputs.aliases }}
          EMAIL: ${{ steps.cfg.outputs.email }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: MODE,APP_NAME,APP_PATH,PORT,DOMAIN,ALIASES,EMAIL

          script: |
            set -e

            cd "$APP_PATH"

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm install --force

            echo "Building..."
            npm run build

            echo "Starting/restarting $APP_NAME on port $PORT..."
            PORT=$PORT pm2 restart "$APP_NAME" --update-env || PORT=$PORT pm2 start npm --name "$APP_NAME" -- start
            pm2 save

            if [ "$MODE" = "host" ]; then
              echo "Ensuring nginx reverse proxy + SSL are set up for $DOMAIN..."

              if ! command -v nginx >/dev/null 2>&1; then
                sudo apt-get update -y
                sudo apt-get install -y nginx
              fi
              if ! command -v certbot >/dev/null 2>&1; then
                sudo apt-get update -y
                sudo apt-get install -y certbot python3-certbot-nginx
              fi

              SITE_CONF="/etc/nginx/sites-available/$DOMAIN"
              if [ ! -f "$SITE_CONF" ]; then
                echo "Creating nginx site config for $DOMAIN -> 127.0.0.1:$PORT"
                sudo tee "$SITE_CONF" > /dev/null <<NGINXCONF
            server {
                listen 80;
                server_name $DOMAIN $ALIASES;

                location / {
                    proxy_pass http://127.0.0.1:$PORT;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_cache_bypass \$http_upgrade;
                }
            }
            NGINXCONF

                sudo ln -sf "$SITE_CONF" "/etc/nginx/sites-enabled/$DOMAIN"
                sudo nginx -t
                sudo systemctl reload nginx
              else
                echo "nginx config for $DOMAIN already exists, syncing server_name..."
                sudo sed -i "s/^\([[:space:]]*\)server_name .*;/\1server_name $DOMAIN $ALIASES;/" "$SITE_CONF"
                sudo nginx -t
                sudo systemctl reload nginx
              fi

              ALL_DOMAINS="$DOMAIN $ALIASES"
              CERT_DOMAINS=""
              for d in $ALL_DOMAINS; do CERT_DOMAINS="$CERT_DOMAINS -d $d"; done

              CERT_FILE="/etc/letsencrypt/live/$DOMAIN/cert.pem"
              NEED_CERT=0
              if ! sudo test -f "$CERT_FILE"; then
                NEED_CERT=1
              else
                COVERED=$(sudo openssl x509 -in "$CERT_FILE" -noout -ext subjectAltName 2>/dev/null | grep -o 'DNS:[^, ]*' | sed 's/^DNS://' || true)
                for d in $ALL_DOMAINS; do
                  echo "$COVERED" | grep -qxF "$d" || NEED_CERT=1
                done
              fi

              if [ "$NEED_CERT" = "1" ]; then
                echo "Requesting/expanding SSL certificate for:$CERT_DOMAINS"
                sudo certbot --nginx $CERT_DOMAINS --expand --non-interactive --agree-tos -m "$EMAIL" --redirect
              else
                echo "SSL certificate already covers: $ALL_DOMAINS"
              fi
            fi

            echo "Deployment successful."
